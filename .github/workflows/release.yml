# Publish on a version tag: git tag v0.1.1 && git push --tags
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: npm ci

      # Fixtures are generated by tifffile itself, so the decoder is tested
      # against the library that writes the files in the first place.
      - run: pip install numpy tifffile imagecodecs
      - run: npm run fixtures
      - run: npm run verify

      - run: npx --yes @vscode/vsce package --no-dependencies -o tif-sciviewer.vsix

      - name: Publish to the Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish --no-dependencies --packagePath tif-sciviewer.vsix

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx publish tif-sciviewer.vsix

      - uses: softprops/action-gh-release@v2
        with:
          files: tif-sciviewer.vsix
