# Cut a release:  npm version <patch|minor|major> && git push --follow-tags
#
# Builds, tests and packages the tagged version, then attaches the .vsix to a
# GitHub Release and keeps it as a workflow artifact. It does not publish: the
# .vsix is uploaded to the Marketplace by hand (see docs/PUBLISHING.md), so no
# Marketplace credential exists anywhere in CI.
#
# The tag is the only trigger. There is no workflow_dispatch on purpose: the
# safety check below compares the tag against package.json, and a manual run
# would have no tag to compare against.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  # Create the GitHub Release and upload the .vsix to it. Nothing else.
  contents: write

# Never let two runs build the same tag's release at once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Package ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      # Runs before anything is built. The Marketplace reads the version from
      # inside the .vsix and never takes the same version twice, so a tag that
      # disagrees with the manifest would hang a file of one version on the
      # release of another - and uploading it would use up that number.
      - name: Check the tag matches package.json
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}."
            echo "::error::Set \"version\": \"${tag}\" in package.json, or retag as v${pkg}."
            exit 1
          fi
          echo "version=${pkg}" >> "$GITHUB_OUTPUT"
          echo "vsix=tif-sciviewer-${pkg}.vsix" >> "$GITHUB_OUTPUT"
          echo "Releasing ${GITHUB_REF_NAME} (package.json ${pkg})"

      # See ci.yml: the fixtures are generated by tifffile, not committed.
      - name: Generate test fixtures
        run: |
          python -m pip install --upgrade pip
          pip install numpy tifffile imagecodecs
          npm run fixtures

      - name: Typecheck, build and test
        run: npm run verify

      - name: Package
        run: npm run package:release

      - name: Confirm the expected .vsix was produced
        run: |
          set -euo pipefail
          test -f "${{ steps.version.outputs.vsix }}"
          ls -l "${{ steps.version.outputs.vsix }}"

      # The same file as the release asset, on the run's own page. Artifacts
      # download as a .zip and expire; the release asset is the lasting copy.
      - name: Keep the .vsix as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tif-sciviewer-${{ steps.version.outputs.version }}
          path: ${{ steps.version.outputs.vsix }}
          if-no-files-found: error

      # GitHub's own release mechanism, using the token the runner already has.
      # Written to be safe to re-run: a second run updates the asset instead of
      # failing on an existing release.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VSIX: ${{ steps.version.outputs.vsix }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; updating its asset."
            gh release upload "$GITHUB_REF_NAME" "$VSIX" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag \
              "$VSIX"
          fi

      # The run's summary page is where you land from the Actions tab, so it
      # carries the two manual steps that follow.
      - name: Summarise the manual upload
        env:
          VSIX: ${{ steps.version.outputs.vsix }}
        run: |
          release="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          {
            echo "## ${GITHUB_REF_NAME} is packaged - upload it to the Marketplace by hand"
            echo
            echo "1. Download \`${VSIX}\` from the [${GITHUB_REF_NAME} release](${release}), or from"
            echo "   *Artifacts* below (that one comes zipped - upload the \`.vsix\` inside it)."
            echo "2. Go to <https://marketplace.visualstudio.com/manage>, open the"
            echo "   \`tif-sciviewer\` row's **...** menu, choose **Update**, and select the file."
          } >> "$GITHUB_STEP_SUMMARY"
